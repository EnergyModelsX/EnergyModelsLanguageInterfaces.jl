inputs:
  install-external-dependencies:
    description: Install Conda/submodules/external models
    required: false
    default: "false"
name: before-script
description: "Common before script"
runs:
  using: "composite"
  steps:
    - name: Update and install Linux dependencies
      if: runner.os == 'Linux' && inputs.install-external-dependencies == 'true'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git g++ cmake wget curl python3-pip
        wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
        bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda
        echo "$HOME/miniconda/bin" >> $GITHUB_PATH
        source "$HOME/miniconda/etc/profile.d/conda.sh"

        conda create --name testenv python=3.11 -y
        conda activate testenv
        conda install -c conda-forge -y poetry highs highspy conan
        conan profile detect

        cd "$GITHUB_WORKSPACE/test/python_module"
        poetry install
        cd "$GITHUB_WORKSPACE"

        cd "$GITHUB_WORKSPACE/.."
        git clone https://gitlab.sintef.no/harald.svendsen/wind_power_timeseries
        git clone https://github.com/iDesignRES/Tecnalia_Solar-Energy-Model.git
        git clone https://github.com/iDesignRES/Tecnalia_Building-Stock-Energy-Model.git
        git clone https://github.com/iDesignRES/CHP_modelling

        cd "$GITHUB_WORKSPACE/../wind_power_timeseries"
        git checkout 313cefea33216c2fdecec916c3d2b42f967f755c
        poetry install
        pip install metocean-api==1.1.14
        cd "$GITHUB_WORKSPACE"

        cd "$GITHUB_WORKSPACE/../Tecnalia_Solar-Energy-Model"
        git checkout v0.10.0
        poetry install
        cd "$GITHUB_WORKSPACE"

        cd "$GITHUB_WORKSPACE/../Tecnalia_Building-Stock-Energy-Model"
        git checkout v0.10.0
        poetry install
        cd "$GITHUB_WORKSPACE"

        cd "$GITHUB_WORKSPACE/../CHP_modelling"
        git checkout v0.5.0
        mkdir build
        cd build
        conan install .. --output-folder=. --build=missing -s compiler.cppstd=17 -s arch=x86_64
        cmake .. -DCMAKE_TOOLCHAIN_FILE="${PWD}/conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
        cd "$GITHUB_WORKSPACE"
      shell: bash
    - name: Install Windows dependencies + Miniconda + python/cpp modules
      if: runner.os == 'Windows' && inputs.install-external-dependencies == 'true'
      run: |
        # Download & install Miniconda into %USERPROFILE%\miniconda
        $installer = Join-Path $env:RUNNER_TEMP "Miniconda3-latest-Windows-x86_64.exe"
        Invoke-WebRequest -Uri "https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe" -OutFile $installer

        $target = Join-Path $env:USERPROFILE "miniconda"
        Start-Process -FilePath $installer -ArgumentList "/InstallationType=JustMe", "/S", "/D=$target" -Wait

        # Initialize conda for this PowerShell session
        $conda = Join-Path $target "Scripts\conda.exe"
        & $conda "shell.powershell" "hook" | Out-String | Invoke-Expression

        conda create --name testenv python=3.11 -y
        conda activate testenv
        $env:PATH = "$env:CONDA_PREFIX\Scripts;$env:CONDA_PREFIX;$env:PATH"
        python -m pip install --upgrade pip
        conda install -c conda-forge -y poetry highs highspy conan
        conan profile detect

        # Check highs installation
        where.exe highs
        highs --version
        
        Set-Location (Join-Path $env:GITHUB_WORKSPACE "..")
        git clone https://gitlab.sintef.no/harald.svendsen/wind_power_timeseries
        git clone https://github.com/iDesignRES/Tecnalia_Solar-Energy-Model.git
        git clone https://github.com/iDesignRES/Tecnalia_Building-Stock-Energy-Model.git
        git clone https://github.com/iDesignRES/CHP_modelling

        # Poetry installs
        Set-Location (Join-Path $env:GITHUB_WORKSPACE "test\python_module")
        poetry install
        Set-Location (Join-Path $env:GITHUB_WORKSPACE "..\wind_power_timeseries")
        git checkout 313cefea33216c2fdecec916c3d2b42f967f755c
        poetry install
        pip install metocean-api==1.1.14
        Set-Location (Join-Path $env:GITHUB_WORKSPACE "..\Tecnalia_Solar-Energy-Model")
        git checkout v0.10.0
        poetry install
        Set-Location (Join-Path $env:GITHUB_WORKSPACE "..\Tecnalia_Building-Stock-Energy-Model")
        git checkout v0.10.0
        poetry install

        Set-Location (Join-Path $env:GITHUB_WORKSPACE "..\CHP_modelling")
        git checkout v0.5.0
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location "build"

        conan install .. --output-folder=. --build=missing -s compiler.cppstd=17 -s arch=x86_64

        cmake .. -DCMAKE_TOOLCHAIN_FILE="$PWD\conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

        Set-Location $env:GITHUB_WORKSPACE
      shell: pwsh
